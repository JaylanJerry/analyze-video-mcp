# NOTE (unreleased next major, this branch): the published 0.6.1 pinned below still
# exposes analyze_video(video, question?) and reads QWEN_ALLOWED_ROOTS /
# QWEN_ALLOW_ANY_LOCAL_VIDEO. After the next major is published, the same install becomes
# analyze_media(media, prompt) with MEDIA_ALLOWED_ROOTS / MEDIA_ALLOW_ANY_LOCAL_FILE /
# MEDIA_MAX_LOCAL_MEDIA_MB. See docs/API_CONTRACT.md and
# docs/SPEC_NEXT_MAJOR_MEDIA_GATEWAY.md for the migration table.

[mcp_servers.analyze_video_mcp]
command = "cmd"
args = ["/c", "npx", "--prefer-offline", "-y", "analyze-video-mcp@0.6.1"]
startup_timeout_sec = 120
tool_timeout_sec = 1200

[mcp_servers.analyze_video_mcp.env]
DASHSCOPE_API_KEY = "YOUR_DASHSCOPE_API_KEY"
QWEN_MODEL = "qwen3.8-omni-flash"
QWEN_ALLOWED_ROOTS = "C:\\Users\\用户名\\Videos"

# Drag a video in from any folder and just ask for the analysis (no confirmation step)?
# Uncomment the line below. Codex hands the Agent a path, not an attachment, so this
# switch is what makes outside-root files acceptable. It also means any local path the
# Agent writes can be uploaded to Bailian. See docs/decisions/0021-allow-any-local-video-opt-in.md
# QWEN_ALLOW_ANY_LOCAL_VIDEO = "on"

# analyze_video is not annotated read-only (it uploads media), so hosts that ask for
# approval will prompt once per call. To skip that prompt for this server only:
# default_tools_approval_mode = "approve"
#
# Usage rule baked into the tool text: it asks the Agent to call this tool only when the
# user explicitly asks for MCP analysis. That is prompt-level guidance, not enforcement —
# keep the switch above off unless you accept any local path being uploadable.

# Unix / macOS: command = "npx", args = ["--prefer-offline", "-y", "analyze-video-mcp@0.6.1"]
# After adding the server, start a new Codex thread. Old threads may not remount tools.
# Verify: codex mcp list   then   codex mcp get analyze_video_mcp
# Codex may not inherit user/system env; keep DASHSCOPE_API_KEY in this env table.
# Fallback: analyze-video-mcp --config C:\\path\\to\\config.env
# --prefer-offline only reduces registry lookups. For a stable install, npm i -g analyze-video-mcp@0.6.1
# and point command at the local binary or dist/index.js.
