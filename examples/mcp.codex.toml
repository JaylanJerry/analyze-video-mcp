# 2.0.0 release candidate (not published yet). Requires Node 24.x.
# Tool: analyze_media(media, prompt). Old authorization variables grant nothing.

[mcp_servers.media_analysis_mcp]
command = "cmd"
args = ["/c", "npx", "--prefer-offline", "-y", "media-analysis-mcp@2.0.0"]
startup_timeout_sec = 120
tool_timeout_sec = 1200

[mcp_servers.media_analysis_mcp.env]
DASHSCOPE_API_KEY = "YOUR_DASHSCOPE_API_KEY"
QWEN_MODEL = "qwen3.8-omni-flash"
MEDIA_ALLOWED_ROOTS = "C:\\Users\\用户名\\Videos"

# Drag media in from any folder and just ask for the analysis (no confirmation step)?
# Uncomment the line below. Codex hands the Agent a path, not an attachment, so this
# switch is what makes outside-root files acceptable. It also means any local path the
# Agent writes can be uploaded to Bailian. See docs/decisions/0021-allow-any-local-video-opt-in.md
# MEDIA_ALLOW_ANY_LOCAL_FILE = "on"

# analyze_media is not annotated read-only (it uploads media), so hosts that ask for
# approval will prompt once per call. To skip that prompt for this server only:
# default_tools_approval_mode = "approve"
#
# Usage rule baked into the tool text: it asks the Agent to call this tool only when the
# user explicitly asks for MCP analysis. That is prompt-level guidance, not enforcement —
# keep the switch above off unless you accept any local path being uploadable.

# Unix / macOS: command = "npx", args = ["--prefer-offline", "-y", "media-analysis-mcp@2.0.0"]
# After adding the server, start a new Codex thread. Old threads may not remount tools.
# Verify: codex mcp list   then   codex mcp get media_analysis_mcp
# Codex may not inherit user/system env; keep DASHSCOPE_API_KEY in this env table.
# Fallback: media-analysis-mcp --config C:\\path\\to\\config.env
# --prefer-offline only reduces registry lookups. For a stable install, npm i -g media-analysis-mcp@2.0.0
# and point command at the local binary or dist/index.js.
