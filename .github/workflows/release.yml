name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci
        env:
          HUSKY: "0"
      - name: Assert tag matches package and PACKAGE_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG ?? "";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const src = readFileSync("src/version.ts", "utf8");
            const match = /PACKAGE_VERSION = "([^"]+)"/.exec(src);
            const pkgVersion = typeof pkg.version === "string" ? pkg.version : "";
            const srcVersion = match?.[1] ?? "";
            if (tag !== `v${pkgVersion}` || tag !== `v${srcVersion}` || pkgVersion !== srcVersion) {
              console.error(JSON.stringify({ tag, pkgVersion, srcVersion }));
              process.exit(1);
            }
            console.log(`tag ${tag} matches ${pkgVersion}`);
          '
      - run: npm run build
      - name: Pack-install probe
        run: npm run test:pack-install
        env:
          HUSKY: "0"
      - name: npx github probe
        run: npm run test:npx-github
        env:
          HUSKY: "0"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Assert Node and npm support trusted publishing
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            const [maj] = process.versions.node.split(".").map(Number);
            if (maj !== 24) {
              console.error("release must run on Node 24.x", process.versions.node);
              process.exit(1);
            }
            const npm = execSync("npm --version", { encoding: "utf8" }).trim();
            const [nMaj, nMin] = npm.split(".").map(Number);
            if ((nMaj ?? 0) < 11 || (nMaj === 11 && (nMin ?? 0) < 5)) {
              console.error("need npm >= 11.5.1", npm);
              process.exit(1);
            }
            console.log(`node ${process.versions.node} npm ${npm}`);
          '
      # 2.0.0 established the renamed package before Trusted Publisher could be configured.
      # Only this exact, maintainer-approved bootstrap artifact may skip publishing.
      - name: Verify already published 2.0.0 bootstrap
        id: bootstrap
        if: github.ref_name == 'v2.0.0'
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { appendFileSync } from "node:fs";
            const metadata = JSON.parse(execFileSync("npm", ["view", "media-analysis-mcp@2.0.0", "--json", "--registry=https://registry.npmjs.org"], { encoding: "utf8" }));
            const expected = "sha512-0mN5OtpSYZ+aprk4hkkUskixwyw9rwm+OIcmBtw5HXzmEevVBuIp+WG2dDsut4SgLEvrajA/P+FASOz0AicMtg==";
            if (metadata.name !== "media-analysis-mcp" || metadata.version !== "2.0.0" || metadata.dist?.integrity !== expected || metadata.dist?.shasum !== "f73dc70cd61c25fcc0337f2503db4df646f3f704") {
              throw new Error("Published bootstrap artifact does not match the approved 2.0.0 package");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, "verified=true\n");
            console.log("Verified the approved bootstrap package; no duplicate publish");
          '
      - name: Publish to npm
        if: steps.bootstrap.outputs.verified != 'true'
        run: npm publish --access public
        env:
          HUSKY: "0"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
