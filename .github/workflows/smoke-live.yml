name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    # Weekly sanity check (Mon ~03:17 UTC). Does not run without a key.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  live:
    if: ${{ vars.LIVE_SMOKE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      QWEN_LIVE_VIDEO: ${{ vars.QWEN_LIVE_VIDEO }}
      QWEN_LIVE_EXPECT_VISUAL: ${{ vars.QWEN_LIVE_EXPECT_VISUAL }}
      QWEN_LIVE_EXPECT_AUDIO: ${{ vars.QWEN_LIVE_EXPECT_AUDIO }}
      QWEN_ALLOWED_ROOTS: ${{ vars.QWEN_ALLOWED_ROOTS }}
      LIVE: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (skip husky in CI)
        run: npm ci
        env:
          HUSKY: "0"
      - name: Fail if the API key is missing
        if: ${{ env.DASHSCOPE_API_KEY == '' }}
        run: |
          echo "LIVE_SMOKE_ENABLED=1 but DASHSCOPE_API_KEY is empty"
          exit 1
      - name: Use the committed live fixture when no URL is configured
        if: ${{ env.QWEN_LIVE_VIDEO == '' }}
        run: echo "QWEN_LIVE_VIDEO=${GITHUB_WORKSPACE}/test/fixtures/live-av.mp4" >> "$GITHUB_ENV"
      - name: Fail if the live fixture is missing
        run: |
          if [ -z "${QWEN_LIVE_VIDEO}" ]; then
            echo "LIVE job ran without QWEN_LIVE_VIDEO"
            exit 1
          fi
          if [ ! -f "${QWEN_LIVE_VIDEO}" ] && ! [[ "${QWEN_LIVE_VIDEO}" =~ ^https:// ]]; then
            echo "LIVE fixture path does not exist"
            exit 1
          fi
      - run: npm run test:live
