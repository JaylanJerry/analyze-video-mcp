name: CI

on:
  push:
    branches: [main, develop, feat/video-mcp-v1]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: qwen-omni-mcp

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - name: Install (skip husky in CI)
        run: npm ci
        env:
          HUSKY: "0"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - name: Install (skip husky in CI)
        run: npm ci
        env:
          HUSKY: "0"
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and mock tests including Windows paths
        run: npm test
      - run: npm run build
