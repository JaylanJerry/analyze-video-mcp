name: CI

on:
  push:
    branches: [main, develop, feat/video-mcp-v1]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run format:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run build

  install-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwen-omni-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwen-omni-mcp/package-lock.json
      - name: Install like the root npx prepare
        run: npm ci
        env:
          HUSKY: "0"
      - run: npm run build
      - run: npm run test:install
