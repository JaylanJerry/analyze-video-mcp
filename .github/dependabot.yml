version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint (latest 8.70.0) supports typescript >=4.8.4 <6.1.0;
      # a typescript 7 bump cannot resolve until it ships TS 7 support.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
